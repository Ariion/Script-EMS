<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">

    <!-- ── En-tête ──────────────────────────────────────────────── -->
    <header class="hd">
      <div class="hd-brand">
        <div class="hd-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <rect x="3" y="4" width="18" height="18" rx="3"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
            <circle cx="8.5" cy="16" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="12"  cy="16" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="15.5"cy="16" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="hd-titles">
          <span class="hd-name">Agenda</span>
          <span class="hd-sub">Réservation en ligne</span>
        </div>
      </div>
      <button id="close" class="hd-close" aria-label="Fermer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </header>

    <!-- ── Navigation ───────────────────────────────────────────── -->
    <nav id="tabs" class="tabs hidden"></nav>

    <!-- ── Contenu principal ────────────────────────────────────── -->
    <main id="content" class="content"></main>

  </div>
  <script src="app.js"></script>
</body>
</html>
