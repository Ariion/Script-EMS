<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Nova Medical — Démo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050508;font-family:'Rajdhani',system-ui,sans-serif;overflow:hidden;user-select:none;color:#dce8f4}

.bgl{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity .7s ease}
#bg-a{z-index:0}
#bg-b{z-index:1;opacity:0}
#bg-v{position:fixed;inset:0;z-index:2;background:radial-gradient(ellipse at center,rgba(2,4,12,.36) 0%,rgba(2,4,12,.75) 100%)}

#labels{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  padding-bottom:12vh;gap:10px;
}

.fvl{
  display:flex;align-items:stretch;
  background:rgba(0,0,0,.76);border:1px solid rgba(255,255,255,.12);
  border-radius:3px;overflow:hidden;
  min-width:218px;cursor:pointer;
  backdrop-filter:blur(6px);
  text-decoration:none;
  transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;
}
.fvl:hover{background:rgba(0,0,0,.88);transform:translateX(5px)}

.fvl[data-m=d]:hover{border-color:rgba(34,211,238,.45);box-shadow:0 0 16px rgba(34,211,238,.14)}
.fvl[data-m=i]:hover{border-color:rgba(167,139,250,.45);box-shadow:0 0 16px rgba(167,139,250,.14)}
.fvl[data-m=c]:hover{border-color:rgba(74,222,128,.45);box-shadow:0 0 16px rgba(74,222,128,.14)}

.fvk{
  width:34px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
}
.fvl[data-m=d] .fvk{background:rgba(34,211,238,.9);color:#042028}
.fvl[data-m=i] .fvk{background:rgba(167,139,250,.9);color:#1a0a32}
.fvl[data-m=c] .fvk{background:rgba(74,222,128,.9);color:#042012}

.fvt{
  padding:8px 16px;
  font-family:'Rajdhani',sans-serif;font-weight:600;
  font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  color:#fff;transition:color .15s;
}
.fvl[data-m=d]:hover .fvt{color:#22d3ee}
.fvl[data-m=i]:hover .fvt{color:#a78bfa}
.fvl[data-m=c]:hover .fvt{color:#4ade80}

/* hint bas de page */
#hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:10;font-family:'Orbitron',monospace;font-size:9px;
  letter-spacing:.14em;color:rgba(255,255,255,.2);
  text-align:center;pointer-events:none;
}
</style>
</head>
<body>

<div id="bg-a" class="bgl"></div>
<div id="bg-b" class="bgl"></div>
<div id="bg-v"></div>

<div id="labels">
  <a class="fvl" data-m="d" href="demo/">
    <div class="fvk">E</div>
    <span class="fvt">Diagnostic</span>
  </a>
  <a class="fvl" data-m="i" href="imagerie/">
    <div class="fvk">E</div>
    <span class="fvt">Imagerie</span>
  </a>
  <a class="fvl" data-m="c" href="chirurgie/">
    <div class="fvk">E</div>
    <span class="fvt">Chirurgie</span>
  </a>
</div>

<div id="hint">NOVA OMC v1.3 — NOVACITY</div>

<script>
const BGS={d:'bg_diagnostic.jpg',i:'bg_imagerie.jpg',c:'bg_chirurgie.jpg'};
let front='a',cur=null;
const bgA=document.getElementById('bg-a'),bgB=document.getElementById('bg-b');

Object.values(BGS).forEach(s=>{const im=new Image();im.src=s;});
bgA.style.backgroundImage=`url('${BGS.d}')`;cur='d';

function switchBg(m){
  if(cur===m)return;cur=m;
  const url=`url('${BGS[m]}')`;
  if(front==='a'){bgB.style.backgroundImage=url;bgB.style.opacity='1';bgA.style.opacity='0';front='b';}
  else{bgA.style.backgroundImage=url;bgA.style.opacity='1';bgB.style.opacity='0';front='a';}
}

document.querySelectorAll('.fvl').forEach(el=>{
  el.addEventListener('mouseenter',()=>switchBg(el.dataset.m));
});
</script>
</body>
</html>
